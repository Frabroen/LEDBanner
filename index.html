<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Banner</title>
<meta name="description" content="Convierte tu móvil en un letrero LED">
<meta name="theme-color" content="#0d0c0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banner">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Rubik+Mono+One&family=Bungee&family=Anton&family=Archivo+Black&family=Orbitron:wght@700..900&family=Righteous&family=Fredoka:wght@500;600&family=Baloo+2:wght@700;800&family=Nunito:wght@800;900&family=Quicksand:wght@700&family=Comfortaa:wght@700&family=M+PLUS+Rounded+1c:wght@800&family=Poppins:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --led:#ffb000;
    --frame-led:#ffb000;
    --housing-1:#2c2a26;
    --housing-2:#131210;
    --housing-3:#0a0908;
    --panel-bg:#171614;
    --panel-line:#2c2a26;
    --ink:#c9c4b8;
    --ink-dim:#726d61;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:#050505;
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
    padding-top: env(safe-area-inset-top);
  }

  /* ---------- housing / frames ---------- */
  .stage{
    position:relative;
    flex:1;
    margin:14px;
    border-radius:22px;
    padding: 22px 18px;
    display:flex;
    min-height:0;
  }

  .stage.frame-industrial{
    background:
      radial-gradient(120% 160% at 50% -20%, var(--housing-1), var(--housing-2) 55%, var(--housing-3) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 6px rgba(0,0,0,0.6),
      0 10px 30px rgba(0,0,0,0.6);
  }

  .stage.frame-chrome{
    padding:20px 16px;
    background:
      linear-gradient(180deg,#e9ecef 0%,#9aa1a8 18%,#4e545a 42%,#2b2f33 55%,#6b7278 82%,#c8ced4 100%);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.75),
      inset 0 -2px 3px rgba(0,0,0,.55),
      0 12px 28px rgba(0,0,0,.6);
  }

  /* Hazard — black and yellow warning tape */
  .stage.frame-hazard{
    padding:24px 20px;
    border-radius:12px;
    background: repeating-linear-gradient(
      45deg,
      #f5c400 0 20px,
      #16150f 20px 40px
    );
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.55),
      0 12px 28px rgba(0,0,0,.65);
  }
  .stage.frame-hazard .screen{
    box-shadow: inset 0 0 24px 6px rgba(0,0,0,0.9), 0 0 0 4px #0d0c08;
  }

  /* Neon tube — colour set independently of the text */
  .stage.frame-neon{
    padding:18px 16px;
    background:#050505;
    border:3px solid var(--frame-led);
    box-shadow:
      0 0 8px var(--frame-led),
      0 0 22px var(--frame-led),
      inset 0 0 12px color-mix(in srgb, var(--frame-led) 55%, transparent),
      0 10px 34px rgba(0,0,0,.7);
  }

  /* Marquee bulbs */
  .stage.frame-bulbs{
    padding:30px 28px;
    background: linear-gradient(180deg,#241d17,#120e0a);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 12px 30px rgba(0,0,0,.65);
  }
  .stage.frame-bulbs::before,
  .stage.frame-bulbs::after{
    content:''; position:absolute; inset:9px; border-radius:15px;
    pointer-events:none;
    background-size:24px 24px;
    background-repeat:repeat-x, repeat-x, repeat-y, repeat-y;
    background-image:
      radial-gradient(circle, var(--frame-led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--frame-led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--frame-led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--frame-led) 0 2.6px, transparent 3.2px);
    filter: drop-shadow(0 0 4px var(--frame-led));
  }
  .stage.frame-bulbs::before{
    background-position:0 0, 0 100%, 0 0, 100% 0;
    animation: chaseA var(--chase, 1s) steps(1) infinite;
  }
  .stage.frame-bulbs::after{
    background-position:12px 0, 12px 100%, 0 12px, 100% 12px;
    animation: chaseB var(--chase, 1s) steps(1) infinite;
  }
  @keyframes chaseA{0%,49%{opacity:1;} 50%,100%{opacity:.22;}}
  @keyframes chaseB{0%,49%{opacity:.22;} 50%,100%{opacity:1;}}

  .stage.frame-none{
    margin:0; padding:0; border-radius:0;
    background:#000;
  }
  .stage.frame-none .screen{border-radius:0;}

  .screw{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #6b6862, #17150f 70%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.15) inset, 0 1px 2px rgba(0,0,0,0.8);
    display:none;
  }
  .screw.tl{top:10px; left:10px;} .screw.tr{top:10px; right:10px;}
  .screw.bl{bottom:10px; left:10px;} .screw.br{bottom:10px; right:10px;}
  .stage.frame-industrial .screw{display:block;}

  /* ---------- screen ---------- */
  .screen{
    position:relative;
    flex:1;
    border-radius:10px;
    background:#000;
    overflow:hidden;
    box-shadow: inset 0 0 24px 6px rgba(0,0,0,0.9);
  }
  .dots-overlay{
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.88) 34%, transparent 35%);
    background-size: 7px 7px;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:3;
  }
  .screen-sheen{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%);
    pointer-events:none;
    z-index:4;
  }
  .power-dot{
    position:absolute; bottom:6px; right:10px;
    width:5px; height:5px; border-radius:50%;
    background: var(--led);
    box-shadow:0 0 4px 1px var(--led);
    opacity:.55;
    z-index:4;
  }
  .icon-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:1;
    display:none;
  }

  .track{
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center;
    white-space:nowrap;
    will-change:transform;
    z-index:1;
  }
  .track span{
    color: var(--led);
    text-shadow: 0 0 4px currentColor, 0 0 14px currentColor, 0 0 30px currentColor;
    line-height:1.15;
    letter-spacing:0.03em;
    padding:0 4vw;
  }

  .track span.rainbow{
    background: linear-gradient(90deg,#ff2b2b,#ffb000,#2bff5d,#2bd0ff,#4d7bff,#ff4de0,#ff2b2b);
    background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    text-shadow:none;
    filter: drop-shadow(0 0 5px rgba(255,255,255,.5)) drop-shadow(0 0 16px rgba(255,140,255,.4));
    animation: hueflow 12s linear infinite;
  }
  @keyframes hueflow{ from{background-position:0 0;} to{background-position:200% 0;} }

  /* Estilo: Neón */
  .track span.neon{
    color:#fff;
    text-shadow:
      0 0 3px #fff,
      0 0 9px var(--led),
      0 0 20px var(--led),
      0 0 42px var(--led),
      0 0 72px var(--led);
  }
  .track span.rainbow.neon{
    filter:
      drop-shadow(0 0 4px rgba(255,255,255,.9))
      drop-shadow(0 0 14px rgba(255,255,255,.55))
      drop-shadow(0 0 34px rgba(255,120,255,.5))
      drop-shadow(0 0 60px rgba(120,180,255,.4));
  }
  .screen.neon .dots-overlay{opacity:.18;}

  /* Estilo: Texto — flat modern type, no LED matrix at all */
  .track span.plain{
    text-shadow:none;
    letter-spacing:-0.01em;
  }
  .track span.plain.rainbow{ filter:none; }
  .screen.plain .dots-overlay{display:none;}
  .screen.plain .screen-sheen{display:none;}
  .screen.plain .power-dot{display:none;}

  /* corner controls — each button reveals its own bar */
  .fabs{
    position:fixed; right:14px; bottom:16px;
    display:none; flex-direction:column; gap:12px; z-index:20;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.bars-on .fabs{display:flex;}
  .fab-wrap{position:relative; display:flex; justify-content:flex-end;}
  .fab{
    width:52px; height:52px; border-radius:50%;
    background:rgba(18,17,15,.62);
    border:1px solid rgba(255,255,255,.16);
    color:#e8e4da;
    font-family:'Space Grotesk',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .fab .v{font-size:15px; font-weight:600; line-height:1;}
  .fab .t{font-size:8px; letter-spacing:.08em; color:rgba(255,255,255,.45); line-height:1;}
  .fab.open{background:rgba(255,176,0,.92); color:#1a1100; border-color:transparent;}
  .fab.open .t{color:rgba(26,17,0,.55);}

  .pop{
    position:absolute; bottom:calc(100% + 10px); right:0;
    display:none; flex-direction:column; align-items:center; gap:8px;
  }
  .pop.open{display:flex;}

  .vbar{
    position:relative;
    width:52px; height:210px; border-radius:26px;
    background:rgba(18,17,15,.62);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
  }
  .vbar input[type=range]{
    width:170px;                 /* becomes the height once rotated */
    transform:rotate(-90deg);
    margin:0;
  }
  .vbar.dim input[type=range]{opacity:.3;}
  .fill-btn{
    width:52px; height:40px; border-radius:16px;
    background:rgba(18,17,15,.62);
    border:1px solid rgba(255,255,255,.14);
    color:#e8e4da; font-size:16px; line-height:1;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .fill-btn.on{background:rgba(255,176,0,.9); color:#1a1100; border-color:transparent;}
  .size-readout{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:'Space Grotesk',sans-serif; font-size:13px;
    background:rgba(18,17,15,.8); color:#e8e4da;
    padding:8px 14px; border-radius:10px;
    z-index:21; pointer-events:none; opacity:0;
    transition:opacity .18s;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .size-readout.show{opacity:1;}

  /* immersive fallback (iPhone Safari has no Fullscreen API) */
  body.immersive .handle,
  body.immersive .panel{display:none;}
  body.immersive{
    padding-top:0;
    /* 100lvh = the viewport with the browser bars collapsed, so the sign
       still fills the screen once Safari hides them. The extra pixel gives
       the page something to scroll, which is what triggers that collapse. */
    height:calc(100lvh + 1px);
    overflow-y:auto;
  }
  body.immersive .stage{
    margin:0; border-radius:0;
    height:100lvh;
  }

  /* ---------- drawer handle ---------- */
  .handle{
    appearance:none; border:0; width:100%;
    background:linear-gradient(180deg, var(--housing-1), var(--housing-3));
    color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
    font-size:13px; letter-spacing:.02em;
    padding:9px 0 12px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    flex-shrink:0;
  }
  .handle .bar{width:36px; height:4px; border-radius:3px; background:#45423b;}

  /* ---------- panel ---------- */
  .panel{
    background:var(--panel-bg);
    border-top:1px solid var(--panel-line);
    max-height:0;
    overflow:hidden;
    transition:max-height .32s ease;
    flex-shrink:0;
  }
  .panel.open{max-height:70dvh; overflow-y:auto;}
  .panel-inner{padding:6px 18px 22px;}

  .field{margin-top:18px;}
  .field label{
    display:block; font-size:11px; color:var(--ink-dim);
    margin-bottom:8px; letter-spacing:.02em;
  }
  .text-input{
    width:100%; background:#0c0b0a; border:1px solid var(--panel-line);
    color:var(--ink); font-family:'Space Grotesk', sans-serif; font-size:15px;
    padding:11px 12px; border-radius:8px; outline:none;
  }
  .text-input:focus{border-color:var(--led);}

  .swatches{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .swatch{
    width:34px; height:34px; border-radius:50%; border:2px solid transparent;
    background:#000; cursor:pointer; position:relative; flex-shrink:0; padding:0;
  }
  .swatch::after{
    content:''; position:absolute; inset:6px; border-radius:50%;
    background:var(--sw); box-shadow:0 0 8px 1px var(--sw);
  }
  .swatch.active{border-color:var(--ink);}
  .swatch.rainbow-sw::after{
    background: conic-gradient(#ff2b2b,#ffb000,#2bff5d,#2bd0ff,#4d7bff,#ff4de0,#ff2b2b);
    box-shadow:0 0 8px 1px rgba(255,160,220,.75);
  }
  .swatch.auto-sw{
    width:auto; height:34px; border-radius:9px; padding:0 12px;
    border:1px solid var(--panel-line); color:var(--ink-dim); font-size:12px;
    font-family:'Space Grotesk',sans-serif; background:#0c0b0a;
  }
  .swatch.auto-sw::after{display:none;}
  .swatch.auto-sw.active{border-color:var(--led); color:var(--led); background:#28251f;}

  .segmented{display:flex; background:#0c0b0a; border-radius:9px; padding:3px; border:1px solid var(--panel-line);}
  .segmented button{
    flex:1; border:0; background:transparent; color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif; font-size:13px; padding:9px 0;
    border-radius:7px;
  }
  .segmented button.active{background:#28251f; color:var(--led);}

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; border:1px solid var(--panel-line); background:#0c0b0a;
    color:var(--ink-dim); border-radius:9px; padding:10px 15px;
    font-family:'Space Grotesk',sans-serif; font-size:13px; cursor:pointer;
  }
  .chip.active{border-color:var(--led); background:#28251f; color:var(--led);}

  .font-chip{
    flex:0 0 auto; border:1px solid var(--panel-line); background:#0c0b0a;
    color:var(--ink); border-radius:9px; padding:10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    min-width:72px; cursor:pointer;
  }
  .font-chip .sample{font-size:20px; line-height:1.1;}
  .font-chip .cap{font-family:'Space Grotesk',sans-serif; font-size:10px; color:var(--ink-dim);}
  .font-chip.active{border-color:var(--led); background:#28251f;}
  .font-chip.active .sample{color:var(--led);}
  .font-chip.active .cap{color:var(--ink);}

  .slider-row{display:flex; align-items:center; gap:12px;}
  input[type=range]{
    -webkit-appearance:none; flex:1; height:4px; border-radius:2px;
    background:#2c2a26; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--led); box-shadow:0 0 6px var(--led); cursor:pointer;
  }
  .slider-val{font-size:12px; color:var(--ink-dim); width:28px; text-align:right; flex-shrink:0;}

  .actions{display:flex; gap:10px; margin-top:22px;}
  .btn{
    flex:1; border-radius:9px; padding:13px 0;
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:500;
    background:#0c0b0a; color:var(--ink); border:1px solid var(--panel-line);
  }
  .btn.primary{background:var(--led); color:#1a1100; border-color:var(--led); font-weight:600;}
  .install-hint{
    margin-top:14px; font-size:12px; color:var(--ink-dim); line-height:1.5;
    display:none;
  }
</style>
</head>
<body>

  <div class="stage frame-industrial" id="stage">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="screen" id="screen">
      <div class="track" id="track"><span id="textEl">TU TEXTO AQUÍ</span></div>
      <canvas class="icon-canvas" id="iconCanvas"></canvas>
      <div class="dots-overlay"></div>
      <div class="screen-sheen"></div>
      <div class="power-dot"></div>
    </div>
  </div>

  <div class="fabs" id="fabs">
    <div class="fab-wrap">
      <div class="pop" id="speedPop">
        <div class="vbar">
          <input type="range" id="speedBarInput" min="1" max="10" value="5" aria-label="Velocidad">
        </div>
      </div>
      <button class="fab" id="speedFab" aria-label="Ajustar velocidad">
        <span class="v" id="speedFabVal">5</span><span class="t">VEL</span>
      </button>
    </div>
    <div class="fab-wrap">
      <div class="pop" id="sizePop">
        <button class="fill-btn" id="fillBtn" aria-label="Llenar pantalla">⤢</button>
        <div class="vbar" id="sizeBar">
          <input type="range" id="sizeBarInput" min="16" max="240" value="46" aria-label="Tamaño">
        </div>
      </div>
      <button class="fab" id="sizeFab" aria-label="Ajustar tamaño">
        <span class="v" id="sizeFabVal">46</span><span class="t">TAM</span>
      </button>
    </div>
  </div>
  <div class="size-readout" id="sizeReadout"></div>

  <button class="handle" id="handleBtn">
    <span class="bar"></span>
    Ajustes
  </button>

  <div class="panel" id="panel">
    <div class="panel-inner">

      <div class="field" id="textField">
        <label for="textInput">Texto del rótulo</label>
        <input class="text-input" id="textInput" maxlength="140" placeholder="Escribe tu mensaje…" value="TU TEXTO AQUÍ">
      </div>

      <div class="field" id="effectField">
        <label>Efecto del texto</label>
        <div class="segmented" id="effectSeg">
          <button class="active" data-effect="scroll">Desfile</button>
          <button data-effect="blink">Parpadeo</button>
          <button data-effect="static">Fijo</button>
        </div>
      </div>

      <div class="field">
        <label>Animación</label>
        <div class="chip-row" id="iconRow">
          <button class="chip active" data-icon="none">Ninguna</button>
          <button class="chip" data-icon="heart">Corazón</button>
          <button class="chip" data-icon="walk">Caminante</button>
          <button class="chip" data-icon="smile">Sonrisa</button>
          <button class="chip" data-icon="star">Estrella</button>
          <button class="chip" data-icon="arrow">Flecha</button>
          <button class="chip" data-icon="note">Música</button>
          <button class="chip" data-icon="drink">Copa</button>
          <button class="chip" data-icon="dj">DJ</button>
        </div>
      </div>

      <div class="field" id="styleField">
        <label>Estilo</label>
        <div class="segmented" id="styleSeg">
          <button class="active" data-style="led">LED</button>
          <button data-style="neon">Neón</button>
          <button data-style="plain">Texto</button>
        </div>
      </div>

      <div class="field" id="fontField">
        <label>Tipo de letra</label>
        <div class="chip-row" id="fontRow"></div>
      </div>

      <div class="field">
        <label>Color</label>
        <div class="swatches" id="swatches">
          <button class="swatch active" style="--sw:#ffb000" data-color="#ffb000" aria-label="Ámbar"></button>
          <button class="swatch" style="--sw:#ff2b2b" data-color="#ff2b2b" aria-label="Rojo"></button>
          <button class="swatch" style="--sw:#2bff5d" data-color="#2bff5d" aria-label="Verde"></button>
          <button class="swatch" style="--sw:#2bd0ff" data-color="#2bd0ff" aria-label="Cian"></button>
          <button class="swatch" style="--sw:#4d7bff" data-color="#4d7bff" aria-label="Azul"></button>
          <button class="swatch" style="--sw:#ff4de0" data-color="#ff4de0" aria-label="Rosa"></button>
          <button class="swatch" style="--sw:#ffffff" data-color="#ffffff" aria-label="Blanco"></button>
          <button class="swatch rainbow-sw" data-color="rainbow" aria-label="Multicolor"></button>
        </div>
      </div>

      <div class="field">
        <label>Marco</label>
        <div class="chip-row" id="frameRow">
          <button class="chip active" data-frame="industrial">Industrial</button>
          <button class="chip" data-frame="chrome">Cromo</button>
          <button class="chip" data-frame="hazard">Peligro</button>
          <button class="chip" data-frame="neon">Tubo neón</button>
          <button class="chip" data-frame="bulbs">Bombillas</button>
          <button class="chip" data-frame="none">Sin marco</button>
        </div>
      </div>

      <div class="field" id="frameColorField" style="display:none;">
        <label>Color del marco</label>
        <div class="swatches" id="frameSwatches">
          <button class="swatch auto-sw active" data-fcolor="auto">Igual que el texto</button>

        <strong style="color:var(--ink);">¿Ves las barras de Safari?</strong><br>
        iOS no permite pantalla completa real desde el navegador. Toca el botón
        Compartir de Safari → "Añadir a pantalla de inicio", y al abrir Banner
        desde ese icono el letrero ocupará toda la pantalla, sin barras ni pestañas.

<script>
(function(){
  const stage = document.getElementById('stage');
  const screen = document.getElementById('screen');
  const track = document.getElementById('track');
  const textEl = document.getElementById('textEl');
  const iconCanvas = document.getElementById('iconCanvas');
  const iconCtx = iconCanvas.getContext('2d');

  const textInput = document.getElementById('textInput');
  const textField = document.getElementById('textField');
  const effectField = document.getElementById('effectField');
  const effectSeg = document.getElementById('effectSeg');
  const iconRow = document.getElementById('iconRow');
  const styleSeg = document.getElementById('styleSeg');
  const fontField = document.getElementById('fontField');
  const fontRow = document.getElementById('fontRow');
  const swatches = document.getElementById('swatches');
  const frameRow = document.getElementById('frameRow');
  const frameColorField = document.getElementById('frameColorField');
  const frameSwatches = document.getElementById('frameSwatches');
  const speedSlider = document.getElementById('speedSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const speedVal = document.getElementById('speedVal');
  const sizeVal = document.getElementById('sizeVal');
  const handleBtn = document.getElementById('handleBtn');
  const panel = document.getElementById('panel');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const installBtn = document.getElementById('installBtn');
  const iosHint = document.getElementById('iosHint');
  const fabs = document.getElementById('fabs');
  const speedFab = document.getElementById('speedFab');
  const speedFabVal = document.getElementById('speedFabVal');
  const speedPop = document.getElementById('speedPop');
  const speedBarInput = document.getElementById('speedBarInput');
  const sizeFab = document.getElementById('sizeFab');
  const sizeFabVal = document.getElementById('sizeFabVal');
  const sizePop = document.getElementById('sizePop');
  const sizeBar = document.getElementById('sizeBar');
  const sizeBarInput = document.getElementById('sizeBarInput');
  const fillBtn = document.getElementById('fillBtn');
  const sizeReadout = document.getElementById('sizeReadout');
  const fitSeg = document.getElementById('fitSeg');
  const sizeRow = document.getElementById('sizeRow');

  const FRAMES = ['industrial','chrome','hazard','neon','bulbs','none'];
  const COLOURED_FRAMES = ['neon','bulbs'];

  const STORAGE_KEY = 'banner-settings-v2';
  const defaults = {
    text:'TU TEXTO AQUÍ', color:'#ffb000', frameColor:'auto',
    effect:'scroll', icon:'none', style:'led',
    fontLed:'pixel', fontPlain:'fredoka',
    speed:5, size:46, fit:'manual', frame:'industrial'
  };
  let s = Object.assign({}, defaults, loadSettings());

  function loadSettings(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveSettings(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
  }

  // ================= speed =================
  // What used to be level 3 is now the top of the scale, and the slow end
  // reaches far further down. The curve is eased so most of the slider is slow.
  function speedT(){
    const t = (s.speed - 1) / 9;   // 0 .. 1
    return Math.pow(t, 1.8);       // more resolution at the slow end
  }
  function lerp(slow, fast){ return slow + (fast - slow) * speedT(); }

  const scrollPx = () => lerp(0.18, 4.30);   // px per frame
  const blinkMs  = () => lerp(3200, 660);    // text blink period
  const beatMs   = () => lerp(2400, 585);    // sprite frame period
  const chaseSec = () => lerp(3.0, 1.0);     // marquee bulbs
  const hueSec   = () => lerp(34, 11);       // rainbow sweep

  // ================= fonts =================
  const FONTS_LED = [
    { id:'pixel',    name:'Píxel',    family:"'VT323'",          scale:1.15, spacing:'0.03em', weight:400 },
    { id:'arcade',   name:'Arcade',   family:"'Press Start 2P'", scale:0.52, spacing:'0.02em', weight:400 },
    { id:'matriz',   name:'Matriz',   family:"'Silkscreen'",     scale:0.78, spacing:'0.04em', weight:700 },
    { id:'bloque',   name:'Bloque',   family:"'Rubik Mono One'", scale:0.80, spacing:'0.01em', weight:400 },
    { id:'rotulo',   name:'Rótulo',   family:"'Bungee'",         scale:0.82, spacing:'0.02em', weight:400 },
    { id:'estrecha', name:'Estrecha', family:"'Anton'",          scale:1.00, spacing:'0.01em', weight:400 },
    { id:'negra',    name:'Negra',    family:"'Archivo Black'",  scale:0.86, spacing:'0em',    weight:400 },
    { id:'futuro',   name:'Futuro',   family:"'Orbitron'",       scale:0.86, spacing:'0.04em', weight:900 },
    { id:'redonda',  name:'Redonda',  family:"'Righteous'",      scale:0.92, spacing:'0.02em', weight:400 }
  ];
  // Rounded, filled, modern faces for the plain text style
  const FONTS_PLAIN = [
    { id:'fredoka',   name:'Fredoka',   family:"'Fredoka'",           scale:0.95, spacing:'0em',    weight:600 },
    { id:'baloo',     name:'Baloo',     family:"'Baloo 2'",           scale:0.98, spacing:'0em',    weight:800 },
    { id:'nunito',    name:'Nunito',    family:"'Nunito'",            scale:0.92, spacing:'-.01em', weight:900 },
    { id:'mrounded',  name:'Suave',     family:"'M PLUS Rounded 1c'", scale:0.92, spacing:'0em',    weight:800 },
    { id:'quicksand', name:'Quicksand', family:"'Quicksand'",         scale:0.94, spacing:'0em',    weight:700 },
    { id:'comfortaa', name:'Comfortaa', family:"'Comfortaa'",         scale:0.88, spacing:'0em',    weight:700 },
    { id:'poppins',   name:'Poppins',   family:"'Poppins'",           scale:0.90, spacing:'-.01em', weight:800 }
  ];

  function fontSet(){ return s.style === 'plain' ? FONTS_PLAIN : FONTS_LED; }
  function fontId(){ return s.style === 'plain' ? s.fontPlain : s.fontLed; }
  function setFontId(id){
    if(s.style === 'plain') s.fontPlain = id; else s.fontLed = id;
  }
  function currentFont(){
    const set = fontSet();
    return set.find(f => f.id === fontId()) || set[0];
  }

  function buildFontChips(){
    fontRow.innerHTML = '';
    fontSet().forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'font-chip';
      btn.dataset.font = f.id;
      const sample = document.createElement('span');
      sample.className = 'sample';
      sample.style.fontFamily = f.family + ', sans-serif';
      sample.style.fontWeight = f.weight;
      sample.textContent = 'Ag';
      const cap = document.createElement('span');
      cap.className = 'cap';
      cap.textContent = f.name;
      btn.append(sample, cap);
      fontRow.appendChild(btn);
    });
  }

  // ================= sprites =================
  // '.' = off, 'X' = lit. mode 'pulse' stays centred, 'walk' travels across.
  const ICONS = {
    heart: { mode:'pulse', frames:[
      ['.........',
       '..XX.XX..',
       '.XXXXXXX.',
       '.XXXXXXX.',
       '.XXXXXXX.',
       '..XXXXX..',
       '...XXX...',
       '....X....',
       '.........'],
      ['.XX...XX.',
       'XXXXXXXXX',
       'XXXXXXXXX',
       'XXXXXXXXX',
       'XXXXXXXXX',
       '.XXXXXXX.',
       '..XXXXX..',
       '...XXX...',
       '....X....']
    ]},
    walk: { mode:'walk', frames:[
      ['..XXX..',
       '..XXX..',
       '...X...',
       '.XXXXX.',
       '...X...',
       '...X...',
       '...X...',
       '..X.X..',
       '.X...X.',
       'X.....X'],
      ['..XXX..',
       '..XXX..',
       '...X...',
       '.XXXXX.',
       '...X...',
       '...X...',
       '...X...',
       '...X...',
       '...X...',
       '..X.X..']
    ]},
    smile: { mode:'pulse', frames:[
      ['..XXXXX..',
       '.X.....X.',
       'X..X.X..X',
       'X.......X',
       'X.......X',
       'X.X...X.X',
       '.X.XXX.X.',
       '..XXXXX..'],
      ['..XXXXX..',
       '.X.....X.',
       'X..X.XX.X',
       'X.....X.X',
       'X.......X',
       'X.X...X.X',
       '.X.XXX.X.',
       '..XXXXX..']
    ]},
    star: { mode:'pulse', frames:[
      ['....X....',
       '...XXX...',
       'XXXXXXXXX',
       '.XXXXXXX.',
       '..XXXXX..',
       '.XXXXXXX.',
       '.XX...XX.',
       '.X.....X.'],
      ['.........',
       '....X....',
       '...XXX...',
       '.XXXXXXX.',
       '..XXXXX..',
       '..XX.XX..',
       '.........',
       '.........']
    ]},
    arrow: { mode:'walk', frames:[
      ['...XX....',
       '....XX...',
       'XXXXXXX..',
       'XXXXXXXX.',
       'XXXXXXX..',
       '....XX...',
       '...XX....'],
      ['....XX...',
       '.....XX..',
       '.XXXXXXX.',
       '.XXXXXXXX',
       '.XXXXXXX.',
       '.....XX..',
       '....XX...']
    ]},
    note: { mode:'pulse', frames:[
      ['...XXXX',
       '...XXXX',
       '...X..X',
       '...X...',
       '...X...',
       '...X...',
       'XXXX...',
       'XXXX...'],
      ['...XXXX',
       '...XXXX',
       '...X.XX',
       '...X..X',
       '...X...',
       '...X...',
       'XXXX...',
       'XXXX...']
    ]},
    drink: { mode:'pulse', frames:[
      ['.........',
       'XXXXXXXXX',
       '.XXXXXXX.',
       '..XXXXX..',
       '...XXX...',
       '....X....',
       '....X....',
       '..XXXXX..'],
      ['....X....',
       'XXXXXXXXX',
       '.XXXXXXX.',
       '..XXXXX..',
       '...XXX...',
       '....X....',
       '....X....',
       '..XXXXX..']
    ]},
    dj: { mode:'pulse', frames:[
      ['....XXX....',
       '....XXX....',
       '...XXXXX...',
       '.X..XXX..X.',
       'XX.XXXXX.XX',
       '...XXXXX...',
       'XXXXXXXXXXX',
       'X..XXXXX..X',
       'X.XX...XX.X',
       'XXXXXXXXXXX'],
      ['....XXX....',
       '....XXX....',
       '...XXXXX...',
       '....XXX....',
       '.XXXXXXXXX.',
       '...XXXXX...',
       'XXXXXXXXXXX',
       'X.XX...XX.X',
       'X..XXXXX..X',
       'XXXXXXXXXXX']
    ]}
  };

  // ================= colour helpers =================
  const UI_FALLBACK = '#ffb000';
  function uiColor(){ return s.color === 'rainbow' ? UI_FALLBACK : s.color; }
  function frameColor(){ return s.frameColor === 'auto' ? uiColor() : s.frameColor; }

  // ================= apply =================
  function applyAll(){
    textEl.textContent = s.text || ' ';
    textInput.value = s.text;

    FRAMES.forEach(f => stage.classList.toggle('frame-' + f, f === s.frame));
    [...frameRow.children].forEach(b => b.classList.toggle('active', b.dataset.frame === s.frame));

    document.documentElement.style.setProperty('--led', uiColor());
    screen.style.setProperty('--led', uiColor());
    stage.style.setProperty('--frame-led', frameColor());
    stage.style.setProperty('--chase', chaseSec() + 's');

    const animOn = s.icon !== 'none';
    textEl.classList.toggle('rainbow', s.color === 'rainbow');
    textEl.classList.toggle('neon', s.style === 'neon');
    textEl.classList.toggle('plain', s.style === 'plain');
    screen.classList.toggle('neon', s.style === 'neon');
    screen.classList.toggle('plain', s.style === 'plain');
    textEl.style.animationDuration = hueSec() + 's';

    [...swatches.children].forEach(b => b.classList.toggle('active', b.dataset.color === s.color));
    [...frameSwatches.children].forEach(b => b.classList.toggle('active', b.dataset.fcolor === s.frameColor));
    [...styleSeg.children].forEach(b => b.classList.toggle('active', b.dataset.style === s.style));
    [...effectSeg.children].forEach(b => b.classList.toggle('active', b.dataset.effect === s.effect));
    [...iconRow.children].forEach(b => b.classList.toggle('active', b.dataset.icon === s.icon));
    [...fontRow.children].forEach(b => b.classList.toggle('active', b.dataset.font === fontId()));

    // text controls are irrelevant while an animation is playing
    textField.style.display   = animOn ? 'none' : '';
    effectField.style.display = animOn ? 'none' : '';
    fontField.style.display   = animOn ? 'none' : '';
    frameColorField.style.display = COLOURED_FRAMES.indexOf(s.frame) !== -1 ? '' : 'none';

    speedSlider.value = s.speed; speedVal.textContent = s.speed;
    sizeSlider.value = s.size;   sizeVal.textContent = s.size;
    [...fitSeg.children].forEach(b => b.classList.toggle('active', b.dataset.fit === s.fit));
    sizeRow.style.display = s.fit === 'fill' ? 'none' : '';
    speedBarInput.value = s.speed;
    sizeBarInput.value = s.size;
    speedFabVal.textContent = s.speed;
    sizeFabVal.textContent = s.fit === 'fill' ? '⤢' : s.size;
    sizeBarInput.disabled = s.fit === 'fill';
    sizeBar.classList.toggle('dim', s.fit === 'fill');
    fillBtn.classList.toggle('on', s.fit === 'fill');
    syncControls();

    applyFace();
    setupEffect();
  }

  function applyFace(){
    const f = currentFont();
    textEl.style.fontFamily = f.family + ', sans-serif';
    textEl.style.fontWeight = f.weight;
    textEl.style.letterSpacing = f.spacing;
    textEl.style.fontSize = Math.round(s.size * f.scale) + 'px';
  }

  // Grows the type until it just fills the screen. Recomputed on every
  // resize and rotation, so it fills both portrait and landscape.
  function fitText(){
    const w = screen.clientWidth, h = screen.clientHeight;
    if(!w || !h) return;
    const scrolling = (s.effect === 'scroll');
    const maxW = w * 0.97, maxH = h * 0.96;

    let lo = 8, hi = Math.max(24, h * 1.6);
    for(let i = 0; i < 20; i++){
      const mid = (lo + hi) / 2;
      textEl.style.fontSize = mid + 'px';
      // in scroll mode the text runs off-screen on purpose, so only height counts
      const fits = scrolling
        ? textEl.offsetHeight <= maxH
        : (textEl.scrollWidth <= maxW && textEl.offsetHeight <= maxH);
      if(fits) lo = mid; else hi = mid;
    }
    textEl.style.fontSize = Math.floor(lo) + 'px';
  }

  function showReadout(txt){
    // in fullscreen the sign is the finished piece: no overlays at all
    if(document.body.classList.contains('viewing')) return;
    sizeReadout.textContent = txt;
    sizeReadout.classList.add('show');
    clearTimeout(showReadout._t);
    showReadout._t = setTimeout(function(){
      sizeReadout.classList.remove('show');
    }, 900);
  }

  // ================= animation engine =================
  let rafId = null, blinkTimer = null;

  function stopAnim(){
    if(rafId) cancelAnimationFrame(rafId);
    if(blinkTimer) clearInterval(blinkTimer);
    rafId = null; blinkTimer = null;
    textEl.style.opacity = 1;
    iconCtx.clearRect(0, 0, iconCanvas.width, iconCanvas.height);
  }

  function resizeIconCanvas(){
    const dpr = window.devicePixelRatio || 1;
    iconCanvas.width = screen.clientWidth * dpr;
    iconCanvas.height = screen.clientHeight * dpr;
    iconCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function dotColor(rx, ry, t){
    if(s.color === 'rainbow'){
      const hue = ((rx * 16 + ry * 9 + t * 0.02) % 360 + 360) % 360;
      return 'hsl(' + hue + ' 100% 62%)';
    }
    return s.color;
  }

  function drawSprite(rows, x, cellSize, t){
    const w = screen.clientWidth, h = screen.clientHeight;
    iconCtx.clearRect(0, 0, w, h);
    const cols = rows[0].length;
    const originY = (h - rows.length * cellSize) / 2;
    const neon = s.style === 'neon';
    const plain = s.style === 'plain';
    const r = cellSize * (neon ? 0.46 : plain ? 0.48 : 0.42);

    for(let ry = 0; ry < rows.length; ry++){
      for(let rx = 0; rx < cols; rx++){
        if(rows[ry][rx] !== 'X') continue;
        const cx = x + rx * cellSize + cellSize / 2;
        const cy = originY + ry * cellSize + cellSize / 2;
        if(cx < -cellSize || cx > w + cellSize) continue;
        const col = dotColor(rx, ry, t);
        iconCtx.fillStyle = col;
        iconCtx.shadowColor = col;
        iconCtx.shadowBlur = plain ? 0 : cellSize * (neon ? 2.4 : 0.9);
        iconCtx.beginPath();
        iconCtx.arc(cx, cy, r, 0, Math.PI * 2);
        iconCtx.fill();
        if(neon){
          iconCtx.fill();
          iconCtx.shadowBlur = cellSize * 0.6;
          iconCtx.fillStyle = '#fff';
          iconCtx.beginPath();
          iconCtx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
          iconCtx.fill();
        }
      }
    }
  }

  function runIconAnim(){
    resizeIconCanvas();
    const icon = ICONS[s.icon];
    if(!icon) return;
    const rowsCount = icon.frames[0].length;
    const cols = icon.frames[0][0].length;
    let cellSize;
    if(s.fit === 'fill'){
      // largest cell that still fits the sprite on screen, both axes
      const byHeight = (screen.clientHeight * 0.94) / rowsCount;
      const byWidth  = (screen.clientWidth  * 0.94) / cols;
      cellSize = icon.mode === 'walk' ? byHeight : Math.min(byHeight, byWidth);
    } else {
      const baseCell = (screen.clientHeight * 0.72) / rowsCount;
      cellSize = Math.max(4, Math.min(320, baseCell * (s.size / 46)));
    }
    const spriteW = cols * cellSize;
    const centreX = (screen.clientWidth - spriteW) / 2;

    let frameIdx = 0;
    let x = icon.mode === 'walk' ? screen.clientWidth : centreX;
    let dist = 0, lastBeat = 0;
    const step = scrollPx();
    const swapEvery = cellSize * 3;
    const beat = beatMs();

    function tick(now){
      if(icon.mode === 'walk'){
        x -= step;
        dist += step;
        if(dist > swapEvery){ dist = 0; frameIdx = (frameIdx + 1) % icon.frames.length; }
        if(x < -spriteW) x = screen.clientWidth;
      } else if(now - lastBeat > beat){
        lastBeat = now;
        frameIdx = (frameIdx + 1) % icon.frames.length;
      }
      drawSprite(icon.frames[frameIdx], x, cellSize, now);
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  function setupEffect(){
    stopAnim();
    const animOn = s.icon !== 'none';
    track.style.display = animOn ? 'none' : 'flex';
    iconCanvas.style.display = animOn ? 'block' : 'none';

    if(animOn){ runIconAnim(); return; }

    if(s.effect === 'scroll'){
      track.style.width = 'auto';
      track.style.justifyContent = 'flex-start';
      textEl.style.width = 'auto';
      textEl.style.whiteSpace = 'nowrap';
      textEl.style.textAlign = 'left';
      if(s.fit === 'fill') fitText();
      const screenW = screen.clientWidth;
      let pos = screenW;
      track.style.transform = 'translateX(' + pos + 'px)';
      const px = scrollPx();
      const step = function(){
        pos -= px;
        const textW = textEl.offsetWidth;
        if(pos < -textW) pos = screenW;
        track.style.transform = 'translateX(' + pos + 'px)';
        rafId = requestAnimationFrame(step);
      };
      rafId = requestAnimationFrame(step);
      return;
    }

    // blink and static: centred horizontally and vertically
    track.style.width = '100%';
    track.style.transform = 'translateX(0)';
    track.style.justifyContent = 'center';
    textEl.style.width = '100%';
    textEl.style.whiteSpace = 'normal';
    textEl.style.textAlign = 'center';
    if(s.fit === 'fill') fitText();

    if(s.effect === 'blink'){
      let on = true;
      blinkTimer = setInterval(function(){
        on = !on;
        textEl.style.opacity = on ? 1 : 0.08;
      }, blinkMs());
    }
  }

  // ================= events =================
  textInput.addEventListener('input', function(){
    s.text = textInput.value || ' ';
    textEl.textContent = s.text;
    saveSettings();
    if(s.effect === 'scroll') setupEffect();
  });

  swatches.addEventListener('click', function(e){
    const btn = e.target.closest('.swatch');
    if(!btn) return;
    s.color = btn.dataset.color;
    applyAll(); saveSettings();
  });

  frameSwatches.addEventListener('click', function(e){
    const btn = e.target.closest('.swatch');
    if(!btn) return;
    s.frameColor = btn.dataset.fcolor;
    applyAll(); saveSettings();
  });

  effectSeg.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    s.effect = btn.dataset.effect;
    applyAll(); saveSettings();
  });

  iconRow.addEventListener('click', function(e){
    const btn = e.target.closest('.chip');
    if(!btn) return;
    s.icon = btn.dataset.icon;
    applyAll(); saveSettings();
  });

  styleSeg.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    s.style = btn.dataset.style;
    buildFontChips();      // LED and plain styles offer different faces
    applyAll(); saveSettings();
  });

  fontRow.addEventListener('click', function(e){
    const btn = e.target.closest('.font-chip');
    if(!btn) return;
    setFontId(btn.dataset.font);
    applyAll(); saveSettings();
  });

  frameRow.addEventListener('click', function(e){
    const btn = e.target.closest('.chip');
    if(!btn) return;
    s.frame = btn.dataset.frame;
    applyAll(); saveSettings();
  });

  speedSlider.addEventListener('input', function(){
    s.speed = Number(speedSlider.value);
    speedVal.textContent = s.speed;
    saveSettings();
    applyAll();
  });

  sizeSlider.addEventListener('input', function(){
    s.size = Number(sizeSlider.value);
    sizeVal.textContent = s.size;
    applyFace();
    saveSettings();
    if(s.icon !== 'none') setupEffect();
  });

  handleBtn.addEventListener('click', function(){
    panel.classList.toggle('open');
    syncControls();
  });

  fitSeg.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    s.fit = btn.dataset.fit;
    applyAll(); saveSettings();
  });

  // ---------- corner controls ----------
  function stopTap(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  }
  stopTap(fabs);

  function openPop(which){
    const wantSpeed = which === 'speed' && !speedPop.classList.contains('open');
    const wantSize  = which === 'size'  && !sizePop.classList.contains('open');
    speedPop.classList.toggle('open', wantSpeed);
    sizePop.classList.toggle('open', wantSize);
    speedFab.classList.toggle('open', wantSpeed);
    sizeFab.classList.toggle('open', wantSize);
  }
  function closePops(){
    speedPop.classList.remove('open');
    sizePop.classList.remove('open');
    speedFab.classList.remove('open');
    sizeFab.classList.remove('open');
  }
  function popsOpen(){
    return speedPop.classList.contains('open') || sizePop.classList.contains('open');
  }

  speedFab.addEventListener('click', function(){ openPop('speed'); });
  sizeFab.addEventListener('click', function(){ openPop('size'); });

  speedBarInput.addEventListener('input', function(){
    s.speed = Number(speedBarInput.value);
    applyAll(); saveSettings();
  });

  sizeBarInput.addEventListener('input', function(){
    s.size = Number(sizeBarInput.value);
    s.fit = 'manual';
    applyAll(); saveSettings();
  });

  fillBtn.addEventListener('click', function(e){
    e.stopPropagation();
    s.fit = s.fit === 'fill' ? 'manual' : 'fill';
    applyAll(); saveSettings();
  });

  // pinch to resize directly on the sign
  let pinchStart = 0, pinchSize = 0;
  function pinchDist(t){
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  }
  screen.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){
      pinchStart = pinchDist(e.touches);
      pinchSize = s.size;
    }
  }, {passive:true});
  screen.addEventListener('touchmove', function(e){
    if(e.touches.length === 2 && pinchStart){
      e.preventDefault();
      const ratio = pinchDist(e.touches) / pinchStart;
      const next = Math.max(16, Math.min(240, Math.round(pinchSize * ratio)));
      if(next !== s.size){
        s.size = next;
        s.fit = 'manual';
        showReadout('Tamaño ' + s.size);
        applyAll();
      }
    }
  }, {passive:false});
  screen.addEventListener('touchend', function(){
    if(pinchStart){ pinchStart = 0; saveSettings(); }
  });
  // ---------- fullscreen / immersive ----------
  const hasFullscreen = !!document.documentElement.requestFullscreen;
  let immersive = false;

  screen.addEventListener('click', function(){
    if(popsOpen()){ closePops(); return; }
    toggleBig();
  });

  // Bars belong to the normal view only. In fullscreen the sign is the
  // finished piece, so nothing is drawn over it.
  function syncControls(){
    const viewing = immersive || !!document.fullscreenElement;
    const drawerOpen = panel.classList.contains('open');
    const show = !viewing && !drawerOpen;
    document.body.classList.toggle('bars-on', show);
    document.body.classList.toggle('viewing', viewing);
    if(!show) closePops();
  }
  document.addEventListener('fullscreenchange', function(){
    // leaving fullscreen with a system gesture should also drop immersive mode
    if(!document.fullscreenElement && immersive && hasFullscreen){
      immersive = false;
      document.body.classList.remove('immersive');
      window.scrollTo(0, 0);
    }
    syncControls();
    setTimeout(setupEffect, 120);   // re-fit once the new size settles
  });

  // Safari only collapses its toolbars once the page is scrolled a little.
  function nudgeChromeAway(){
    if(!document.body.classList.contains('immersive')) return;
    window.scrollTo(0, 1);
    setTimeout(function(){ window.scrollTo(0, 1); }, 120);
    setTimeout(function(){ window.scrollTo(0, 1); }, 400);
  }

  function setImmersive(on){
    immersive = on;
    document.body.classList.toggle('immersive', on);
    if(on){
      panel.classList.remove('open');
      nudgeChromeAway();
    } else {
      window.scrollTo(0, 0);
    }
    syncControls();
    setupEffect();
  }

  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ nudgeChromeAway(); setupEffect(); }, 250);
  });

  function toggleBig(){
    const on = immersive || !!document.fullscreenElement;
    if(!on){
      setImmersive(true);
      // fullscreen the whole document, not just the sign, so the size
      // controls stay on screen (fixed elements outside the fullscreen
      // element are not rendered)
      if(hasFullscreen){
        document.documentElement.requestFullscreen().catch(function(){});
      }
      if(window.screen.orientation && window.screen.orientation.lock){
        window.screen.orientation.lock('landscape').catch(function(){});
      }
    } else {
      if(document.fullscreenElement && document.exitFullscreen){
        document.exitFullscreen().catch(function(){});
      }
      setImmersive(false);
    }
  }
  fullscreenBtn.addEventListener('click', toggleBig);
  if(!hasFullscreen) fullscreenBtn.textContent = 'Modo pantalla';

  // ---------- wake lock ----------
  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') requestWakeLock();
  });
  requestWakeLock();

  window.addEventListener('resize', function(){ setupEffect(); });

  // ---------- install ----------
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', async function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(isIOS && !isStandalone) iosHint.style.display = 'block';

  // ---------- service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  buildFontChips();
  applyAll();

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ setupEffect(); });
  }
})();
</script>
</body>
</html>
