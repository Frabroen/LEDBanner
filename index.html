<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Banner</title>
<meta name="description" content="Convierte tu móvil en un letrero LED">
<meta name="theme-color" content="#0d0c0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banner">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Rubik+Mono+One&family=Bungee&family=Anton&family=Archivo+Black&family=Orbitron:wght@700..900&family=Righteous&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --led:#ffb000;
    --housing-1:#2c2a26;
    --housing-2:#131210;
    --housing-3:#0a0908;
    --panel-bg:#171614;
    --panel-line:#2c2a26;
    --ink:#c9c4b8;
    --ink-dim:#726d61;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:#050505;
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
    padding-top: env(safe-area-inset-top);
  }

  /* ---------- housing / bezel ---------- */
  .stage{
    position:relative;
    flex:1;
    margin:14px;
    border-radius:22px;
    padding: 22px 18px;
    display:flex;
    min-height:0;
  }

  /* Industrial — the default plastic LED housing */
  .stage.frame-industrial{
    background:
      radial-gradient(120% 160% at 50% -20%, var(--housing-1), var(--housing-2) 55%, var(--housing-3) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 6px rgba(0,0,0,0.6),
      0 10px 30px rgba(0,0,0,0.6);
  }

  /* Chrome — brushed metal rail */
  .stage.frame-chrome{
    padding:20px 16px;
    background:
      linear-gradient(180deg,#e9ecef 0%,#9aa1a8 18%,#4e545a 42%,#2b2f33 55%,#6b7278 82%,#c8ced4 100%);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.75),
      inset 0 -2px 3px rgba(0,0,0,.55),
      0 12px 28px rgba(0,0,0,.6);
  }

  /* Wood — pub signboard */
  .stage.frame-wood{
    padding:24px 20px;
    border-radius:14px;
    background:
      repeating-linear-gradient(91deg, rgba(0,0,0,.16) 0 2px, transparent 2px 9px),
      linear-gradient(180deg,#7b4a24,#5a3418 45%,#40230f);
    box-shadow:
      inset 0 2px 0 rgba(255,210,160,.28),
      inset 0 -3px 8px rgba(0,0,0,.6),
      0 12px 26px rgba(0,0,0,.6);
  }

  /* Neon tube — glowing outline in the sign's own colour */
  .stage.frame-neon{
    padding:18px 16px;
    background:#050505;
    border:3px solid var(--led);
    box-shadow:
      0 0 8px var(--led),
      0 0 22px var(--led),
      inset 0 0 12px color-mix(in srgb, var(--led) 55%, transparent),
      0 10px 34px rgba(0,0,0,.7);
  }

  /* Marquee — chasing bulbs, theatre style */
  .stage.frame-bulbs{
    padding:30px 28px;
    background: linear-gradient(180deg,#241d17,#120e0a);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 12px 30px rgba(0,0,0,.65);
  }
  .stage.frame-bulbs::before,
  .stage.frame-bulbs::after{
    content:''; position:absolute; inset:9px; border-radius:15px;
    pointer-events:none;
    background-repeat:no-repeat;
  }
  .stage.frame-bulbs::before{
    background-image:
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px);
    background-size:24px 24px;
    background-position:0 0, 0 100%, 0 0, 100% 0;
    background-repeat:repeat-x, repeat-x, repeat-y, repeat-y;
    filter: drop-shadow(0 0 4px var(--led));
    animation: chaseA var(--chase, 1s) steps(1) infinite;
  }
  .stage.frame-bulbs::after{
    background-image:
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px),
      radial-gradient(circle, var(--led) 0 2.6px, transparent 3.2px);
    background-size:24px 24px;
    background-position:12px 0, 12px 100%, 0 12px, 100% 12px;
    background-repeat:repeat-x, repeat-x, repeat-y, repeat-y;
    filter: drop-shadow(0 0 4px var(--led));
    animation: chaseB var(--chase, 1s) steps(1) infinite;
  }
  @keyframes chaseA{0%,49%{opacity:1;} 50%,100%{opacity:.22;}}
  @keyframes chaseB{0%,49%{opacity:.22;} 50%,100%{opacity:1;}}

  /* Frameless — edge to edge */
  .stage.frame-none{
    margin:0; padding:0; border-radius:0;
    background:#000;
  }
  .stage.frame-none .screen{border-radius:0;}

  /* screws only belong on the bolted frames */
  .screw{display:none;}
  .stage.frame-industrial .screw,
  .stage.frame-wood .screw{display:block;}
  .screw{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #6b6862, #17150f 70%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.15) inset, 0 1px 2px rgba(0,0,0,0.8);
  }
  .screw.tl{top:10px; left:10px;} .screw.tr{top:10px; right:10px;}
  .screw.bl{bottom:10px; left:10px;} .screw.br{bottom:10px; right:10px;}
  .stage.frame-wood .screw{
    background: radial-gradient(circle at 35% 35%, #d9c08e, #6b4a1c 70%);
  }

  .screen{
    position:relative;
    flex:1;
    border-radius:10px;
    background:#000;
    overflow:hidden;
    box-shadow: inset 0 0 24px 6px rgba(0,0,0,0.9);
  }
  .dots-overlay{
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.88) 34%, transparent 35%);
    background-size: 7px 7px;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:3;
  }
  .screen-sheen{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%);
    pointer-events:none;
    z-index:4;
  }
  .icon-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:1;
    display:none;
  }
  .power-dot{
    position:absolute; bottom:6px; right:10px;
    width:5px; height:5px; border-radius:50%;
    background: var(--led);
    box-shadow:0 0 4px 1px var(--led);
    opacity:.55;
    z-index:4;
  }

  .track{
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center;
    white-space:nowrap;
    will-change:transform;
    z-index:1;
  }
  .track span{
    font-family: var(--face, 'VT323'), monospace;
    color: var(--led);
    text-shadow: 0 0 4px currentColor, 0 0 14px currentColor, 0 0 30px currentColor;
    line-height:1;
    letter-spacing:0.03em;
    padding:0 4vw;
  }
  /* immersive fallback (iPhone): controls out of the way, sign fills the screen */
  body.immersive .handle,
  body.immersive .panel{display:none;}
  body.immersive{padding-top:0;}
  body.immersive .stage{margin:0; border-radius:0;}
  body.immersive .stage.frame-industrial,
  body.immersive .stage.frame-chrome,
  body.immersive .stage.frame-wood,
  body.immersive .stage.frame-neon,
  body.immersive .stage.frame-bulbs{border-radius:0;}

  /* ---------- drawer handle ---------- */
  .handle{
    appearance:none; border:0; width:100%;
    background:linear-gradient(180deg, var(--housing-1), var(--housing-3));
    color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
    font-size:13px; letter-spacing:.02em;
    padding:9px 0 12px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    flex-shrink:0;
  }
  .handle .bar{width:36px; height:4px; border-radius:3px; background:#45423b;}
  .handle-row{display:flex; align-items:center; gap:8px;}

  /* ---------- panel ---------- */
  .panel{
    background:var(--panel-bg);
    border-top:1px solid var(--panel-line);
    max-height:0;
    overflow:hidden;
    transition:max-height .32s ease;
    flex-shrink:0;
  }
  .panel.open{max-height:70dvh; overflow-y:auto;}
  .panel-inner{padding:6px 18px 22px;}

  .field{margin-top:18px;}
  .field label{
    display:block; font-size:11px; color:var(--ink-dim);
    margin-bottom:8px; letter-spacing:.02em;
  }
  .text-input{
    width:100%; background:#0c0b0a; border:1px solid var(--panel-line);
    color:var(--ink); font-family:'Space Grotesk', sans-serif; font-size:15px;
    padding:11px 12px; border-radius:8px; outline:none;
  }
  .text-input:focus{border-color:var(--led);}

  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{
    width:34px; height:34px; border-radius:50%; border:2px solid transparent;
    background:#000; cursor:pointer; position:relative; flex-shrink:0;
  }
  .swatch::after{
    content:''; position:absolute; inset:6px; border-radius:50%;
    background:var(--sw); box-shadow:0 0 8px 1px var(--sw);
  }
  .swatch.active{border-color:var(--ink);}

  .segmented{display:flex; background:#0c0b0a; border-radius:9px; padding:3px; border:1px solid var(--panel-line);}
  .segmented button{
    flex:1; border:0; background:transparent; color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif; font-size:13px; padding:9px 0;
    border-radius:7px;
  }
  .segmented button.active{background:#28251f; color:var(--led);}

  .track span.rainbow{
    background: linear-gradient(90deg,#ff2b2b,#ffb000,#2bff5d,#2bd0ff,#4d7bff,#ff4de0,#ff2b2b);
    background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    text-shadow:none;
    filter: drop-shadow(0 0 5px rgba(255,255,255,.5)) drop-shadow(0 0 16px rgba(255,140,255,.4));
    animation: hueflow 6s linear infinite;
  }
  @keyframes hueflow{ from{background-position:0 0;} to{background-position:200% 0;} }

  .track span.neon{
    color:#fff;
    text-shadow:
      0 0 3px #fff,
      0 0 9px var(--led),
      0 0 20px var(--led),
      0 0 42px var(--led),
      0 0 72px var(--led);
  }
  .track span.rainbow.neon{
    filter:
      drop-shadow(0 0 4px rgba(255,255,255,.9))
      drop-shadow(0 0 14px rgba(255,255,255,.55))
      drop-shadow(0 0 34px rgba(255,120,255,.5))
      drop-shadow(0 0 60px rgba(120,180,255,.4));
  }
  /* neon tubes aren't a dot grid — soften the matrix mask */
  .screen.neon .dots-overlay{opacity:.18;}

  .swatch.rainbow-sw::after{
    background: conic-gradient(#ff2b2b,#ffb000,#2bff5d,#2bd0ff,#4d7bff,#ff4de0,#ff2b2b);
    box-shadow:0 0 8px 1px rgba(255,160,220,.75);
  }

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; border:1px solid var(--panel-line); background:#0c0b0a;
    color:var(--ink-dim); border-radius:9px; padding:10px 15px;
    font-family:'Space Grotesk',sans-serif; font-size:13px; cursor:pointer;
  }
  .chip.active{border-color:var(--led); background:#28251f; color:var(--led);}

  .fonts{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .fonts::-webkit-scrollbar{display:none;}
  .font-chip{
    flex:0 0 auto; border:1px solid var(--panel-line); background:#0c0b0a;
    color:var(--ink); border-radius:9px; padding:10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    min-width:72px; cursor:pointer;
  }
  .font-chip .sample{font-size:20px; line-height:1.1;}
  .font-chip .cap{font-family:'Space Grotesk',sans-serif; font-size:10px; color:var(--ink-dim);}
  .font-chip.active{border-color:var(--led); background:#28251f;}
  .font-chip.active .sample{color:var(--led);}
  .font-chip.active .cap{color:var(--ink);}

  .slider-row{display:flex; align-items:center; gap:12px;}
  input[type=range]{
    -webkit-appearance:none; flex:1; height:4px; border-radius:2px;
    background:#2c2a26; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--led); box-shadow:0 0 6px var(--led); cursor:pointer;
  }
  .slider-val{font-size:12px; color:var(--ink-dim); width:28px; text-align:right; flex-shrink:0;}

  .actions{display:flex; gap:10px; margin-top:22px;}
  .btn{
    flex:1; border:0; border-radius:9px; padding:13px 0;
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:500;
    background:#0c0b0a; color:var(--ink); border:1px solid var(--panel-line);
  }
  .btn.primary{background:var(--led); color:#1a1100; border-color:var(--led); font-weight:600;}
  .install-hint{
    margin-top:14px; font-size:12px; color:var(--ink-dim); line-height:1.5;
    display:none;
  }
</style>
</head>
<body>

  <div class="stage frame-industrial" id="stage">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="screen" id="screen">
      <div class="track" id="track"><span id="textEl">TU TEXTO AQUÍ</span></div>
      <canvas class="icon-canvas" id="iconCanvas"></canvas>
      <div class="dots-overlay"></div>
      <div class="screen-sheen"></div>
      <div class="power-dot"></div>
    </div>
  </div>

  <button class="handle" id="handleBtn">
    <div class="handle-row"><span class="bar"></span></div>
    Ajustes
  </button>

  <div class="panel" id="panel">
    <div class="panel-inner">

      <div class="field" id="textField">
        <label for="textInput">Texto del rótulo</label>
        <input class="text-input" id="textInput" maxlength="140" placeholder="Escribe tu mensaje…" value="TU TEXTO AQUÍ">
      </div>

      <div class="field" id="iconField" style="display:none;">
        <label>Animación</label>
        <div class="segmented" id="iconSeg">
          <button class="active" data-icon="heart">❤ Corazón</button>
          <button data-icon="walk">🚶 Caminante</button>
        </div>
      </div>

      <div class="field" id="fontField">
        <label>Tipo de letra</label>
        <div class="fonts" id="fontRow"></div>
      </div>

      <div class="field">
        <label>Color LED</label>
        <div class="swatches" id="swatches">
          <button class="swatch active" style="--sw:#ffb000" data-color="#ffb000" aria-label="Ámbar"></button>
          <button class="swatch" style="--sw:#ff2b2b" data-color="#ff2b2b" aria-label="Rojo"></button>
          <button class="swatch" style="--sw:#2bff5d" data-color="#2bff5d" aria-label="Verde"></button>
          <button class="swatch" style="--sw:#2bd0ff" data-color="#2bd0ff" aria-label="Cian"></button>
          <button class="swatch" style="--sw:#4d7bff" data-color="#4d7bff" aria-label="Azul"></button>
          <button class="swatch" style="--sw:#ff4de0" data-color="#ff4de0" aria-label="Rosa"></button>
          <button class="swatch" style="--sw:#ffffff" data-color="#ffffff" aria-label="Blanco"></button>
          <button class="swatch rainbow-sw" data-color="rainbow" aria-label="Multicolor"></button>
        </div>
      </div>

      <div class="field">
        <label>Marco</label>
        <div class="chip-row" id="frameRow">
          <button class="chip active" data-frame="industrial">Industrial</button>
          <button class="chip" data-frame="chrome">Cromo</button>
          <button class="chip" data-frame="wood">Madera</button>
          <button class="chip" data-frame="neon">Tubo neón</button>
          <button class="chip" data-frame="bulbs">Bombillas</button>
          <button class="chip" data-frame="none">Sin marco</button>
        </div>
      </div>

      <div class="field">
        <label>Brillo</label>
        <div class="segmented" id="glowSeg">
          <button class="active" data-glow="led">LED</button>
          <button data-glow="neon">Neón</button>
        </div>
      </div>

      <div class="field">
        <label>Efecto</label>
        <div class="segmented" id="effectSeg">
          <button class="active" data-effect="scroll">Desfile</button>
          <button data-effect="blink">Parpadeo</button>
          <button data-effect="static">Fijo</button>
          <button data-effect="animation">Animar</button>
        </div>
      </div>

      <div class="field">
        <label>Velocidad</label>
        <div class="slider-row">
          <input type="range" id="speedSlider" min="1" max="10" value="5">
          <span class="slider-val" id="speedVal">5</span>
        </div>
      </div>

      <div class="field">
        <label>Tamaño</label>
        <div class="slider-row">
          <input type="range" id="sizeSlider" min="20" max="100" value="46">
          <span class="slider-val" id="sizeVal">46</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="fullscreenBtn">Pantalla completa</button>
        <button class="btn primary" id="installBtn" style="display:none;">Instalar app</button>
      </div>
      <div class="install-hint" id="iosHint">
        En iPhone: toca el botón Compartir de Safari y elige "Añadir a pantalla de inicio" para instalar el rótulo como app.
      </div>

    </div>
  </div>

<script>
(function(){
  const screen = document.getElementById('screen');
  const track = document.getElementById('track');
  const textEl = document.getElementById('textEl');
  const textInput = document.getElementById('textInput');
  const swatches = document.getElementById('swatches');
  const effectSeg = document.getElementById('effectSeg');
  const speedSlider = document.getElementById('speedSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const speedVal = document.getElementById('speedVal');
  const sizeVal = document.getElementById('sizeVal');
  const handleBtn = document.getElementById('handleBtn');
  const panel = document.getElementById('panel');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const installBtn = document.getElementById('installBtn');
  const iosHint = document.getElementById('iosHint');
  const stage = document.getElementById('stage');
  const iconCanvas = document.getElementById('iconCanvas');
  const iconCtx = iconCanvas.getContext('2d');
  const textField = document.getElementById('textField');
  const iconField = document.getElementById('iconField');
  const iconSeg = document.getElementById('iconSeg');

  const fontRow = document.getElementById('fontRow');
  const fontField = document.getElementById('fontField');
  const glowSeg = document.getElementById('glowSeg');
  const frameRow = document.getElementById('frameRow');

  const FRAMES = ['industrial','chrome','wood','neon','bulbs','none'];

  const STORAGE_KEY = 'led-banner-settings-v1';
  const defaults = { text:'TU TEXTO AQUÍ', color:'#ffb000', effect:'scroll', speed:5, size:46, icon:'heart', font:'pixel', glow:'led', frame:'industrial' };

  // rainbow isn't a real CSS colour — the chrome (sliders, chips, power dot) needs one
  const UI_FALLBACK = '#ffb000';
  function uiColor(){ return s.color === 'rainbow' ? UI_FALLBACK : s.color; }

  // ---------- font catalogue ----------
  // scale keeps every face at a similar visual height for the same slider value
  const FONTS = [
    { id:'pixel',   name:'Píxel',    family:"'VT323'",         scale:1.15, spacing:'0.03em' },
    { id:'arcade',  name:'Arcade',   family:"'Press Start 2P'",scale:0.52, spacing:'0.02em' },
    { id:'matriz',  name:'Matriz',   family:"'Silkscreen'",    scale:0.78, spacing:'0.04em' },
    { id:'bloque',  name:'Bloque',   family:"'Rubik Mono One'",scale:0.80, spacing:'0.01em' },
    { id:'rotulo',  name:'Rótulo',   family:"'Bungee'",        scale:0.82, spacing:'0.02em' },
    { id:'estrecha',name:'Estrecha', family:"'Anton'",         scale:1.00, spacing:'0.01em' },
    { id:'negra',   name:'Negra',    family:"'Archivo Black'", scale:0.86, spacing:'0em'    },
    { id:'futuro',  name:'Futuro',   family:"'Orbitron'",      scale:0.86, spacing:'0.04em' },
    { id:'redonda', name:'Redonda',  family:"'Righteous'",     scale:0.92, spacing:'0.02em' }
  ];

  function currentFont(){
    return FONTS.find(f => f.id === s.font) || FONTS[0];
  }

  function buildFontChips(){
    fontRow.innerHTML = '';
    FONTS.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'font-chip';
      btn.dataset.font = f.id;
      const sample = document.createElement('span');
      sample.className = 'sample';
      sample.style.fontFamily = f.family + ', monospace';
      sample.textContent = 'Ag';
      const cap = document.createElement('span');
      cap.className = 'cap';
      cap.textContent = f.name;
      btn.append(sample, cap);
      fontRow.appendChild(btn);
    });
  }

  // ---------- pixel sprites (dot-matrix, '.'=off 'X'=on) ----------
  const ICONS = {
    heart: {
      mode:'pulse',
      frames:[
        // rest
        ['.........',
         '..XX.XX..',
         '.XXXXXXX.',
         '.XXXXXXX.',
         '.XXXXXXX.',
         '..XXXXX..',
         '...XXX...',
         '....X....',
         '.........'],
        // beat
        ['.XX...XX.',
         'XXXXXXXXX',
         'XXXXXXXXX',
         'XXXXXXXXX',
         'XXXXXXXXX',
         '.XXXXXXX.',
         '..XXXXX..',
         '...XXX...',
         '....X....']
      ]
    },
    walk: {
      mode:'walk',
      frames:[
        ['..XXX..',
         '..XXX..',
         '...X...',
         '.XXXXX.',
         '...X...',
         '...X...',
         '...X...',
         '..X.X..',
         '.X...X.',
         'X.....X'],
        ['..XXX..',
         '..XXX..',
         '...X...',
         '.XXXXX.',
         '...X...',
         '...X...',
         '...X...',
         '...X...',
         '...X...',
         '..X.X..']
      ]
    }
  };
  let s = Object.assign({}, defaults, loadSettings());

  function loadSettings(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveSettings(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
  }

  // ---------- apply settings to UI + display ----------
  function applyAll(){
    textEl.textContent = s.text || ' ';
    textInput.value = s.text;
    FRAMES.forEach(f => stage.classList.toggle('frame-' + f, f === s.frame));
    [...frameRow.children].forEach(b => b.classList.toggle('active', b.dataset.frame === s.frame));
    screen.style.setProperty('--led', uiColor());
    document.documentElement.style.setProperty('--led', uiColor());
    textEl.classList.toggle('rainbow', s.color === 'rainbow');
    textEl.classList.toggle('neon', s.glow === 'neon');
    screen.classList.toggle('neon', s.glow === 'neon');
    // rainbow sweep follows the speed slider
    textEl.style.animationDuration = (14 - s.speed) + 's';
    // so do the marquee bulbs
    stage.style.setProperty('--chase', Math.max(0.18, 1.3 - s.speed * 0.1) + 's');
    [...swatches.children].forEach(b => b.classList.toggle('active', b.dataset.color === s.color));
    [...glowSeg.children].forEach(b => b.classList.toggle('active', b.dataset.glow === s.glow));
    [...effectSeg.children].forEach(b => b.classList.toggle('active', b.dataset.effect === s.effect));
    [...iconSeg.children].forEach(b => b.classList.toggle('active', b.dataset.icon === s.icon));
    [...fontRow.children].forEach(b => b.classList.toggle('active', b.dataset.font === s.font));
    textField.style.display = s.effect === 'animation' ? 'none' : '';
    fontField.style.display = s.effect === 'animation' ? 'none' : '';
    iconField.style.display = s.effect === 'animation' ? '' : 'none';
    speedSlider.value = s.speed; speedVal.textContent = s.speed;
    sizeSlider.value = s.size; sizeVal.textContent = s.size;
    applyFace();
    setupEffect();
  }

  function applyFace(){
    const f = currentFont();
    textEl.style.fontFamily = f.family + ', monospace';
    textEl.style.letterSpacing = f.spacing;
    textEl.style.fontSize = Math.round(s.size * f.scale) + 'px';
  }

  // ---------- scrolling engine ----------
  let rafId = null, pos = 0, blinkTimer = null;

  function stopAnim(){
    if(rafId) cancelAnimationFrame(rafId);
    if(blinkTimer) clearInterval(blinkTimer);
    rafId = null; blinkTimer = null;
    textEl.style.opacity = 1;
    if(iconCtx) iconCtx.clearRect(0, 0, iconCanvas.width, iconCanvas.height);
  }

  // ---------- icon (dot-matrix sprite) engine ----------
  function resizeIconCanvas(){
    const dpr = window.devicePixelRatio || 1;
    iconCanvas.width = screen.clientWidth * dpr;
    iconCanvas.height = screen.clientHeight * dpr;
    iconCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function dotColor(rx, ry, t){
    if(s.color === 'rainbow'){
      const hue = ((rx * 16 + ry * 9 + t * 0.06) % 360 + 360) % 360;
      return 'hsl(' + hue + ' 100% 62%)';
    }
    return s.color;
  }

  function drawSprite(rows, x, cellSize, t){
    const w = screen.clientWidth, h = screen.clientHeight;
    iconCtx.clearRect(0, 0, w, h);
    const cols = rows[0].length;
    const spriteH = rows.length * cellSize;
    const originY = (h - spriteH) / 2;
    const neon = s.glow === 'neon';
    const r = cellSize * (neon ? 0.46 : 0.42);
    for(let ry = 0; ry < rows.length; ry++){
      for(let rx = 0; rx < cols; rx++){
        if(rows[ry][rx] !== 'X') continue;
        const cx = x + rx * cellSize + cellSize / 2;
        const cy = originY + ry * cellSize + cellSize / 2;
        if(cx < -cellSize || cx > w + cellSize) continue;
        const col = dotColor(rx, ry, t);
        iconCtx.shadowColor = col;
        // halo
        iconCtx.shadowBlur = cellSize * (neon ? 2.4 : 0.9);
        iconCtx.fillStyle = col;
        iconCtx.beginPath();
        iconCtx.arc(cx, cy, r, 0, Math.PI * 2);
        iconCtx.fill();
        if(neon){
          // second pass builds the bloom, then a white-hot core like a real tube
          iconCtx.fill();
          iconCtx.shadowBlur = cellSize * 0.6;
          iconCtx.fillStyle = '#fff';
          iconCtx.beginPath();
          iconCtx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
          iconCtx.fill();
        }
      }
    }
  }

  function runIconAnim(){
    resizeIconCanvas();
    const icon = ICONS[s.icon] || ICONS.heart;
    const rowsCount = icon.frames[0].length;
    const baseCell = (screen.clientHeight * 0.72) / rowsCount;
    const cellSize = Math.max(4, Math.min(60, baseCell * (s.size / 46)));
    const cols = icon.frames[0][0].length;
    const spriteW = cols * cellSize;
    const centreX = (screen.clientWidth - spriteW) / 2;

    let frameIdx = 0;
    let x = icon.mode === 'walk' ? screen.clientWidth : centreX;
    let dist = 0;
    let lastBeat = 0;
    const step = Math.max(0.6, 1 + s.speed * 1.1);
    const swapEvery = cellSize * 3;
    const beatEvery = Math.max(160, 750 - s.speed * 55);

    function tick(now){
      if(icon.mode === 'walk'){
        x -= step;
        dist += step;
        if(dist > swapEvery){ dist = 0; frameIdx = (frameIdx + 1) % icon.frames.length; }
        if(x < -spriteW) x = screen.clientWidth;
      } else {
        if(now - lastBeat > beatEvery){
          lastBeat = now;
          frameIdx = (frameIdx + 1) % icon.frames.length;
        }
      }
      drawSprite(icon.frames[frameIdx], x, cellSize, now);
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  function setupEffect(){
    stopAnim();
    track.style.display = s.effect === 'animation' ? 'none' : 'flex';
    iconCanvas.style.display = s.effect === 'animation' ? 'block' : 'none';
    track.style.justifyContent = '';
    textEl.style.whiteSpace = 'nowrap';
    textEl.style.textAlign = 'left';

    if(s.effect === 'animation'){
      runIconAnim();
      return;
    }

    if(s.effect === 'scroll'){
      const screenW = screen.clientWidth;
      pos = screenW;
      track.style.transform = `translateX(${pos}px)`;
      const pxPerFrame = 1 + s.speed * 1.1;
      function step(){
        pos -= pxPerFrame;
        const textW = textEl.offsetWidth;
        if(pos < -textW) pos = screenW;
        track.style.transform = `translateX(${pos}px)`;
        rafId = requestAnimationFrame(step);
      }
      rafId = requestAnimationFrame(step);
    } else if(s.effect === 'blink'){
      track.style.transform = 'translateX(0)';
      track.style.justifyContent = 'center';
      textEl.style.whiteSpace = 'normal';
      textEl.style.textAlign = 'center';
      const interval = Math.max(150, 900 - s.speed * 80);
      let on = true;
      blinkTimer = setInterval(()=>{
        on = !on;
        textEl.style.opacity = on ? 1 : 0.08;
      }, interval);
    } else { // static
      track.style.transform = 'translateX(0)';
      track.style.justifyContent = 'center';
      textEl.style.whiteSpace = 'normal';
      textEl.style.textAlign = 'center';
    }
  }

  // ---------- events ----------
  textInput.addEventListener('input', ()=>{
    s.text = textInput.value || ' ';
    textEl.textContent = s.text;
    saveSettings();
    if(s.effect === 'scroll') setupEffect();
  });

  swatches.addEventListener('click', (e)=>{
    const btn = e.target.closest('.swatch');
    if(!btn) return;
    s.color = btn.dataset.color;
    applyAll(); saveSettings();
  });

  effectSeg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    s.effect = btn.dataset.effect;
    applyAll(); saveSettings();
  });

  iconSeg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    s.icon = btn.dataset.icon;
    applyAll(); saveSettings();
  });

  frameRow.addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    s.frame = btn.dataset.frame;
    applyAll(); saveSettings();
  });

  glowSeg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    s.glow = btn.dataset.glow;
    applyAll(); saveSettings();
  });

  fontRow.addEventListener('click', (e)=>{
    const btn = e.target.closest('.font-chip');
    if(!btn) return;
    s.font = btn.dataset.font;
    applyAll(); saveSettings();
  });

  speedSlider.addEventListener('input', ()=>{
    s.speed = Number(speedSlider.value);
    speedVal.textContent = s.speed;
    saveSettings();
    applyAll();
  });

  sizeSlider.addEventListener('input', ()=>{
    s.size = Number(sizeSlider.value);
    sizeVal.textContent = s.size;
    applyFace();
    saveSettings();
    if(s.effect === 'animation') setupEffect();
  });

  handleBtn.addEventListener('click', ()=>{
    panel.classList.toggle('open');
  });

  // iPhone has no Fullscreen API — fall back to an immersive mode that
  // hides the controls so the sign fills the whole screen.
  const hasFullscreen = !!(stage.requestFullscreen || stage.webkitRequestFullscreen);
  let immersive = false;

  screen.addEventListener('click', toggleBig);

  function setImmersive(on){
    immersive = on;
    document.body.classList.toggle('immersive', on);
    if(on) panel.classList.remove('open');
    if(s.effect === 'scroll' || s.effect === 'animation') setupEffect();
  }

  function toggleBig(){
    if(hasFullscreen){
      if(!document.fullscreenElement){
        stage.requestFullscreen?.().catch(()=>{});
        if(screen.orientation && screen.orientation.lock){
          screen.orientation.lock('landscape').catch(()=>{});
        }
      } else {
        document.exitFullscreen?.();
      }
    } else {
      setImmersive(!immersive);
    }
  }
  fullscreenBtn.addEventListener('click', toggleBig);
  if(!hasFullscreen){
    fullscreenBtn.textContent = 'Modo pantalla';
  }

  // wake lock so the sign stays lit
  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    }catch(e){}
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') requestWakeLock();
  });
  requestWakeLock();

  // recompute scroll on resize
  window.addEventListener('resize', ()=>{ if(s.effect==='scroll' || s.effect==='animation') setupEffect(); });

  // ---------- install prompt ----------
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(isIOS && !isStandalone){
    iosHint.style.display = 'block';
  }

  // ---------- service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  buildFontChips();
  applyAll();

  // webfonts change text width — recompute the marquee once they're ready
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{
      if(s.effect === 'scroll') setupEffect();
    });
  }
})();
</script>
</body>
</html>
